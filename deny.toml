# Configuration for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[licenses]
# The lint level for crates that do not have a license
unlicensed = "deny"
# List of explicitly allowed licenses (permissive and MIT-compatible)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "CC0-1.0",
]
# Confidence threshold for license detection (0.0 - 1.0)
confidence-threshold = 0.8
# Fail if any non-allowed license is encountered
copyleft = "deny"

[licenses.private]
# Ignore internal/workspace crates that are not published
ignore = false

[bans]
# Lint level for crates with security advisories or multiple versions
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Lint level for unknown git or registry sources
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
