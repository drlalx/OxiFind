[package]
name = "oxifind"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Alexander Drichel"]
description = "Fast cross-platform file search engine in Rust with egui GUI, Ratatui TUI, and background indexing daemon."
readme = "README.md"
homepage = "https://github.com/drlalx/OxiFind"
repository = "https://github.com/drlalx/OxiFind"
keywords = ["search", "files", "indexer", "ntfs", "egui"]
categories = ["command-line-utilities", "filesystem"]
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["egui-ui", "tui"]
egui-ui = ["dep:eframe", "dep:egui_extras"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
eframe = { version = "0.37", optional = true }
egui_extras = { version = "0.37", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }
notify = "9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# Temporary workaround for mixed-DPI window dragging; remove after the fix ships in winit 0.30.x.
winit = { git = "https://github.com/LunaticGhoulPiano/winit", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }
