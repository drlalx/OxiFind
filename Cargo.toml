[package]
name = "oxifind"
version = "0.1.0"
edition = "2024"

license = "MIT"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["egui-ui", "tui"]
egui-ui = ["dep:eframe", "dep:egui_extras"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
eframe = { version = "0.36.2", optional = true }
egui_extras = { version = "0.36.2", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", optional = true }
notify = "8.2.0"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[patch.crates-io]
# Temporary workaround for mixed-DPI window dragging; remove after the fix ships in winit 0.30.x.
winit = { git = "https://github.com/LunaticGhoulPiano/winit", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }


