name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly security & dependency audit (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Cargo Check (all targets & feature combinations)
        run: |
          cargo check --all-targets
          cargo check --no-default-features --features tui
          cargo check --no-default-features --features egui-ui

      - name: Clippy (No-Panic & Safety Enforcement)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test (includes license & advisory checks)
        run: cargo test --all-targets -- --nocapture

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows Artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows
          Copy-Item target/release/oxifind.exe dist/windows/
          Copy-Item packaging/windows/oxifind.exe.manifest dist/windows/
          Copy-Item README.md dist/windows/
          Copy-Item LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath dist/oxifind-windows-x86_64.zip

      - name: Package Linux Artifacts
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist/linux
          cp target/release/oxifind dist/linux/
          cp packaging/linux/oxifind.desktop dist/linux/
          cp README.md LICENSE dist/linux/
          tar -czf dist/oxifind-linux-x86_64.tar.gz -C dist/linux .

      - name: Package macOS Artifacts
        if: matrix.os == 'macos-latest'
        run: |
          ARCH="$(uname -m)"
          mkdir -p dist/macos
          cp target/release/oxifind dist/macos/
          cp packaging/macos/Info.plist dist/macos/
          cp README.md LICENSE dist/macos/
          tar -czf "dist/oxifind-macos-${ARCH}.tar.gz" -C dist/macos .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxifind-${{ matrix.os }}
          path: dist/*.*
